<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Testpress{% endblock %} • Forum</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons 1.11.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bs-body-bg: #101010;
            --bs-body-color: #f3f5f7;
            --threads-card-bg: #181818;
            --threads-card-hover: #1e1e1e;
            --threads-border: #242424;
            --threads-border-subtle: rgba(255, 255, 255, 0.08);
            --threads-pill-bg: #ffffff;
            --threads-pill-text: #000000;
            --threads-secondary: #777777;
            --threads-line: #2e2e2e;
            --threads-danger: #ff453a;
            --testpress-blue: #0066FF;
            --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --feed-max-width: 640px;
        }

        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Testpress Brand Link */
        .testpress-brand {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .testpress-brand:hover {
            transform: scale(1.05);
        }

        /* Sticky Header */
        .threads-header {
            position: sticky;
            top: 0;
            z-index: 1030;
            background: rgba(16, 16, 16, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--threads-border-subtle);
            height: 68px;
        }

        /* Feed container */
        .feed-container {
            max-width: var(--feed-max-width);
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem 5rem 1rem;
        }

        /* Threads Custom Card */
        .threads-card {
            background-color: var(--threads-card-bg);
            border: 1px solid var(--threads-border);
            border-radius: 18px;
            padding: 1.25rem 1.4rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .threads-card:hover {
            background-color: var(--threads-card-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        /* Avatar */
        .threads-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            background: linear-gradient(135deg, #333333 0%, #1f1f1f 100%);
            border: 1px solid var(--threads-border);
            flex-shrink: 0;
        }

        .threads-avatar-lg {
            width: 48px;
            height: 48px;
            font-size: 1.2rem;
        }

        /* Buttons */
        .btn-threads-pill {
            background-color: var(--threads-pill-bg);
            color: var(--threads-pill-text);
            font-weight: 700;
            border-radius: 50rem;
            padding: 0.45rem 1.25rem;
            font-size: 0.88rem;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-threads-pill:hover {
            background-color: #e5e5e5;
            color: #000000;
            transform: translateY(-1px);
        }

        .btn-threads-secondary {
            background-color: #222222;
            color: #f3f5f7;
            font-weight: 600;
            border-radius: 50rem;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            border: 1px solid var(--threads-border);
            transition: all 0.2s ease;
        }

        .btn-threads-secondary:hover {
            background-color: #2c2c2c;
            border-color: #444444;
            color: #ffffff;
        }

        /* Thread Action Icons */
        .action-btn {
            background: transparent;
            border: none;
            color: var(--threads-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 50rem;
            transition: all 0.15s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .action-btn:hover {
            color: var(--bs-body-color);
            background: rgba(255, 255, 255, 0.08);
        }

        .action-btn.liked {
            color: var(--threads-danger);
        }

        .action-btn.liked i {
            color: var(--threads-danger);
        }

        /* Connected Thread Stream UI */
        .thread-stream {
            background-color: var(--threads-card-bg);
            border: 1px solid var(--threads-border);
            border-radius: 18px;
            overflow: hidden;
        }

        .thread-stream-item {
            display: flex;
            gap: 14px;
            padding: 1.25rem 1.4rem;
            transition: background-color 0.15s ease;
        }

        .thread-stream-item:not(:last-child) {
            border-bottom: 1px solid var(--threads-border-subtle);
        }

        .thread-stream-item:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .thread-line-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .thread-connector {
            width: 2px;
            flex-grow: 1;
            background-color: var(--threads-line);
            margin-top: 8px;
            margin-bottom: -16px;
            border-radius: 2px;
        }

        /* Form styling */
        .form-control-threads {
            background-color: #121212;
            border: 1px solid var(--threads-border);
            border-radius: 12px;
            color: #f3f5f7;
            padding: 0.85rem 1.1rem;
            font-size: 0.95rem;
        }

        .form-control-threads:focus {
            background-color: #151515;
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .form-control-threads::placeholder {
            color: var(--threads-secondary);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Threads Top Navigation Header (Bootstrap Navbar) -->
    <header class="threads-header d-flex align-items-center">
        <div class="container d-flex align-items-center justify-content-between" style="max-width: var(--feed-max-width);">
            <!-- Back navigation / Feed label -->
            <a href="{% url 'home' %}" class="btn-threads-secondary d-inline-flex align-items-center gap-2 text-decoration-none">
                <i class="bi bi-arrow-left"></i>
                <span class="d-none d-sm-inline">Feed</span>
            </a>

            <!-- Testpress Logo & Brand -->
            <a href="{% url 'home' %}" class="d-inline-flex align-items-center gap-2 text-decoration-none testpress-brand" title="Testpress Forum">
                <!-- Testpress Geometric Blue Logo SVG -->
                <svg viewBox="0 0 40 40" width="34" height="34" fill="none" class="flex-shrink-0">
                    <!-- Upper-right rounded L shape -->
                    <path d="M 10 14.5 C 10 10.5 12.5 8 16.5 8 L 24.5 8 C 28.5 8 31 10.5 31 14.5 L 31 22.5 C 31 26.5 28.5 29 24.5 29" 
                          stroke="#0066FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Lower-left rounded block -->
                    <rect x="7" y="21" width="9" height="9" rx="3.5" fill="#0066FF"/>
                </svg>
                <span class="fw-bold text-white fs-5" style="letter-spacing: -0.03em;">testpress</span>
            </a>

            <!-- Right actions: Auth state and navigation -->
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <div class="dropdown">
                        <button class="btn btn-threads-secondary py-1 px-2 d-inline-flex align-items-center gap-2 dropdown-toggle border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="threads-avatar" style="width: 30px; height: 30px; font-size: 0.8rem; background: linear-gradient(135deg, #0066FF, #00C6FF);">
                                {{ user.username|slice:":1"|upper }}
                            </div>
                            <span class="text-white small fw-bold d-none d-sm-inline">{{ user.username }}</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg" style="background: var(--threads-card-bg); border: 1px solid var(--threads-border); border-radius: 12px; min-width: 200px;">
                            <li>
                                <span class="dropdown-item-text small text-secondary">
                                    Signed in as <strong class="text-white d-block">{{ user.username }}</strong>
                                </span>
                            </li>
                            <li><hr class="dropdown-divider border-secondary border-opacity-25"></li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-white small py-2" href="{% url 'my_account' %}">
                                    <i class="bi bi-person-gear text-secondary"></i> My Account
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-white small py-2" href="{% url 'password_change' %}">
                                    <i class="bi bi-key text-secondary"></i> Change Password
                                </a>
                            </li>
                            <li><hr class="dropdown-divider border-secondary border-opacity-25"></li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-danger small py-2" href="{% url 'logout' %}">
                                    <i class="bi bi-box-arrow-right"></i> Log Out
                                </a>
                            </li>
                        </ul>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="btn-threads-secondary py-1 px-3 text-decoration-none" style="font-size: 0.82rem;">
                        Log In
                    </a>
                    <a href="{% url 'signup' %}" class="btn-threads-pill py-1 px-3 text-decoration-none" style="font-size: 0.82rem;">
                        Sign Up
                    </a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Feed Container -->
    <main class="feed-container flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5.3.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
