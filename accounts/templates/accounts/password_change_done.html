{% extends 'boards/base.html' %}

{% block title %}Password Changed • Testpress{% endblock %}

{% block content %}
    <div class="d-flex justify-content-center">
        <div class="threads-card w-100 text-center py-5" style="max-width: 480px;">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 2.75rem;"></i>
            <h1 class="h4 fw-bold text-white mt-3 mb-2">Password changed successfully</h1>
            <p class="text-secondary small mb-4">
                Your password has been updated. You can now use your new password next time you sign in.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'my_account' %}" class="btn-threads-secondary text-decoration-none py-2 px-3">
                    My Account
                </a>
                <a href="{% url 'home' %}" class="btn-threads-pill text-decoration-none py-2 px-3">
                    Back to Feed
                </a>
            </div>
        </div>
    </div>
{% endblock %}
