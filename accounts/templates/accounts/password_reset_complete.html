{% extends 'boards/base.html' %}

{% block title %}Password Reset Complete • Testpress{% endblock %}

{% block content %}
    <div class="d-flex justify-content-center">
        <div class="threads-card w-100 text-center py-5" style="max-width: 480px;">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 2.75rem;"></i>
            <h1 class="h4 fw-bold text-white mt-3 mb-2">Password reset successful</h1>
            <p class="text-secondary small mb-4">
                Your new password has been set. You may now proceed to log in with your updated credentials.
            </p>
            <a href="{% url 'login' %}" class="btn-threads-pill text-decoration-none py-2 px-4">
                Log In Now
            </a>
        </div>
    </div>
{% endblock %}
