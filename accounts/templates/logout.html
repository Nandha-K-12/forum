{% extends 'boards/base.html' %}

{% block title %}Logged Out • Testpress{% endblock %}

{% block content %}
    <div class="d-flex justify-content-center">
        <div class="threads-card w-100 text-center py-5" style="max-width: 480px;">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 2.75rem;"></i>
            </div>

            <h1 class="h4 fw-bold text-white mb-2">You've been logged out</h1>
            <p class="text-secondary small mb-4">
                Thank you for visiting Testpress Forum. You can log back in anytime or continue browsing public boards.
            </p>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 px-4">
                <a href="{% url 'login' %}" class="btn-threads-pill text-decoration-none py-2 px-4">
                    Log In Again
                </a>
                <a href="{% url 'home' %}" class="btn-threads-secondary text-decoration-none py-2 px-4">
                    Explore Boards
                </a>
            </div>
        </div>
    </div>
{% endblock %}
